name: secret-scanner
version: "1.0.0"
description: >
  Scans repository files for exposed secrets, API keys, tokens, and credentials
  using regex pattern matching and Shannon entropy analysis. Returns all
  matches with severity ratings and masked evidence. Node.js only, zero
  system dependencies.

input_schema:
  type: object
  required:
    - files
  properties:
    files:
      type: array
      description: "Array of file objects with path and content"
      items:
        type: object
        required: ["path", "content"]
        properties:
          path:
            type: string
          content:
            type: string
      maxItems: 1000
    skip_paths:
      type: array
      description: "Path patterns to skip"
      items:
        type: string
      default:
        - "node_modules"
        - ".git"
        - "dist"
        - "build"
    entropy_threshold:
      type: number
      default: 4.5
      description: "Shannon entropy threshold for high-entropy string detection"
    include_entropy_scan:
      type: boolean
      default: true

output_schema:
  type: object
  properties:
    total_files_scanned:
      type: integer
    total_findings:
      type: integer
    findings:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          file:
            type: string
          line:
            type: integer
          severity:
            type: string
            enum: ["high", "medium", "low"]
          pattern_name:
            type: string
          evidence:
            type: string
            description: "Masked version: first 4 chars + ***REDACTED***"
          matched_by:
            type: string
            enum: ["regex", "entropy", "filename"]
          entropy_score:
            type: number
    skipped_files:
      type: array
      items:
        type: object
        properties:
          path:
            type: string
          reason:
            type: string
