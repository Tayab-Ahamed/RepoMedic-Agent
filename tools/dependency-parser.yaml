name: dependency-parser
version: "1.0.0"
description: >
  Parses package.json to extract all declared dependencies with version ranges.
  Queries the npm registry to fetch current versions, deprecation status, and
  license information for each package. Returns a structured dependency health report.

input_schema:
  type: object
  required:
    - package_json_content
  properties:
    package_json_content:
      type: string
      description: "Raw string content of package.json"
    lockfile_content:
      type: string
      description: "Raw content of package-lock.json or yarn.lock (optional)"
    lockfile_type:
      type: string
      enum: ["npm", "yarn", "pnpm"]
    check_registry:
      type: boolean
      default: true
      description: "Whether to query npm registry for latest versions"
    include_dev:
      type: boolean
      default: false
    batch_size:
      type: integer
      default: 10

output_schema:
  type: object
  properties:
    package_name:
      type: string
    package_version:
      type: string
    node_engine:
      type: string
    has_lockfile:
      type: boolean
    total_dependencies:
      type: integer
    total_dev_dependencies:
      type: integer
    dependencies:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          declared_version:
            type: string
          latest_version:
            type: string
          is_deprecated:
            type: boolean
          deprecation_message:
            type: string
          license:
            type: string
          license_risk:
            type: string
            enum: ["none", "low", "medium", "high"]
          version_gap:
            type: string
            enum: ["current", "patch", "minor", "major", "unknown"]
          is_dev:
            type: boolean
    summary:
      type: object
      properties:
        outdated_count:
          type: integer
        deprecated_count:
          type: integer
        high_license_risk_count:
          type: integer
        major_version_gaps:
          type: integer
