name: secret-scanner
description: >
  Scans repository files for exposed secrets, API keys, tokens, and credentials
  using regex pattern matching and Shannon entropy analysis. Returns all
  matches with severity ratings and masked evidence. Node.js only — zero
  system dependencies.

version: "1.0"

implementation:
  type: node
  entry: src/tools/secretScanner.js
  runtime: node18+

input:
  schema:
    type: object
    required:
      - files
    properties:
      files:
        type: array
        description: "Array of file objects with path and content"
        items:
          type: object
          required: ["path", "content"]
          properties:
            path:
              type: string
            content:
              type: string
        maxItems: 1000
      skip_paths:
        type: array
        description: "Path patterns to skip"
        items:
          type: string
        default:
          - "node_modules"
          - ".git"
          - "dist"
          - "build"
          - "*.min.js"
          - "*.lock"
      entropy_threshold:
        type: number
        default: 4.5
        minimum: 3.0
        maximum: 6.0
        description: "Shannon entropy threshold for high-entropy string detection"
      include_entropy_scan:
        type: boolean
        default: true
        description: "Enable Shannon entropy analysis (may produce false positives)"

output:
  schema:
    type: object
    properties:
      total_files_scanned:
        type: integer
      total_findings:
        type: integer
      findings:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: "e.g. SEC-001"
            file:
              type: string
            line:
              type: integer
            severity:
              type: string
              enum: ["high", "medium", "low"]
            pattern_name:
              type: string
              description: "Human-readable name of the matched pattern"
            evidence:
              type: string
              description: "Masked version of the match (first 4 chars + ***REDACTED***)"
            matched_by:
              type: string
              enum: ["regex", "entropy"]
            entropy_score:
              type: number
              description: "Shannon entropy value (entropy matches only)"
      skipped_files:
        type: array
        description: "Files that were skipped with reason"
        items:
          type: object
          properties:
            path:
              type: string
            reason:
              type: string

patterns:
  high:
    - name: "AWS Access Key ID"
      regex: "AKIA[0-9A-Z]{16}"
    - name: "GitHub PAT Classic"
      regex: "ghp_[0-9a-zA-Z]{36}"
    - name: "GitHub PAT Fine-grained"
      regex: "github_pat_[0-9a-zA-Z_]{82}"
    - name: "Slack Bot Token"
      regex: "xoxb-[0-9]{11,13}-[0-9]{11,13}-[a-zA-Z0-9]{24}"
    - name: "Stripe Live Secret Key"
      regex: "sk_live_[0-9a-zA-Z]{24,}"
    - name: "RSA Private Key"
      regex: "-----BEGIN RSA PRIVATE KEY-----"
    - name: "EC Private Key"
      regex: "-----BEGIN EC PRIVATE KEY-----"
    - name: "PGP Private Key Block"
      regex: "-----BEGIN PGP PRIVATE KEY BLOCK-----"
  medium:
    - name: "Generic API Key Assignment"
      regex: "(?i)(api[_-]?key|apikey)\\s*[=:]\\s*['\"][a-zA-Z0-9_\\-]{20,}['\"]"
    - name: "Generic Password Assignment"
      regex: "(?i)(password|passwd|pwd)\\s*[=:]\\s*['\"][^\\s'\"]{8,}['\"]"
    - name: "Database Connection String with Credentials"
      regex: "(?i)(mongodb|postgres|mysql|redis):\\/\\/[^:]+:[^@]+@"
    - name: "JWT Secret Assignment"
      regex: "(?i)(jwt[_-]?secret|jwt[_-]?key)\\s*[=:]\\s*['\"][^'\"]{10,}['\"]"
    - name: "Bearer Token in Code"
      regex: "(?i)bearer\\s+[a-zA-Z0-9_\\-\\.]{20,}"
    - name: "SendGrid API Key"
      regex: "SG\\.[a-zA-Z0-9_\\-]{22}\\.[a-zA-Z0-9_\\-]{43}"
  low:
    - name: ".env file committed"
      file_pattern: "\\.env(\\.local|\\.prod|\\.production)?$"
    - name: "TODO comment referencing credentials"
      regex: "(?i)todo.{0,30}(key|token|secret|password)"
    - name: "Hardcoded placeholder credentials"
      regex: "(?i)(admin|password123|changeme|secret123|test1234)"

security:
  - "All secret values are masked in output before returning to caller"
  - "No secret values are written to disk, logs, or memory beyond immediate scan"
  - "Scanner is read-only — it does not modify any files"
  - "Evidence field format: first 4 characters + '***REDACTED***'"
