name: file-reader
version: "1.0.0"
description: >
  Reads and parses individual files from a fetched repository tree. Handles
  text content extraction, JSON parsing, YAML parsing, and basic analysis
  for JavaScript/TypeScript files including export detection and JSDoc coverage.

input_schema:
  type: object
  required:
    - files
  properties:
    files:
      type: array
      description: "List of file paths to read and parse"
      items:
        type: string
      maxItems: 200
    repo_path:
      type: string
      description: "Base path or GitHub raw content base URL"
    in_memory_contents:
      type: object
      description: "Key-value map of filepath to content"
    extract_exports:
      type: boolean
      default: false
      description: "For JS/TS files: detect and count exported symbols"
    extract_headings:
      type: boolean
      default: false
      description: "For Markdown files: extract all heading structure"
    max_file_size_kb:
      type: integer
      default: 256

output_schema:
  type: object
  properties:
    results:
      type: array
      items:
        type: object
        properties:
          path:
            type: string
          content:
            type: string
          size_bytes:
            type: integer
          line_count:
            type: integer
          exports:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                line:
                  type: integer
                has_jsdoc:
                  type: boolean
          headings:
            type: array
            items:
              type: object
              properties:
                level:
                  type: integer
                text:
                  type: string
                line:
                  type: integer
          error:
            type: string
