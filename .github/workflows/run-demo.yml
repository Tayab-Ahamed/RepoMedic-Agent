name: Run RepoMedic Demo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Agent Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @open-gitagent/gitagent
      - run: npx gitagent validate
      - run: npx gitagent info

  self-audit:
    name: RepoMedic Self-Audit
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - name: Run offline demo
        run: node example-usage/run-example.js --offline
      - name: Analyze expressjs/express (live demo)
        run: |
          node src/index.js \
            --repo https://github.com/expressjs/express \
            --no-registry \
            --output report.json \
            --json | head -20
        continue-on-error: true
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: repomedic-report
          path: report.json
          if-no-files-found: ignore
