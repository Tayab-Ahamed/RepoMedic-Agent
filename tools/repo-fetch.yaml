name: repo-fetch
version: "1.0.0"
description: >
  Fetches repository file tree and file contents from GitHub via the REST API,
  or walks a local directory path. Returns a structured file tree with metadata.
  No git clone required — uses GitHub API for remote repos.

input_schema:
  type: object
  required:
    - source
  properties:
    source:
      type: string
      description: "GitHub URL (https://github.com/owner/repo) or absolute local path"
    branch:
      type: string
      default: "main"
      description: "Branch or tag to fetch (GitHub only)"
    github_pat:
      type: string
      description: "GitHub Personal Access Token for private repos (optional)"
    max_files:
      type: integer
      default: 500
      description: "Maximum number of files to enumerate"
    include_content:
      type: boolean
      default: false
      description: "Whether to fetch file contents"
    content_extensions:
      type: array
      items:
        type: string
      default: [".js", ".ts", ".jsx", ".tsx", ".json", ".yaml", ".yml", ".md", ".env"]

output_schema:
  type: object
  properties:
    repo:
      type: string
    source_type:
      type: string
      enum: ["github", "local"]
    branch:
      type: string
    fetched_at:
      type: string
    total_files:
      type: integer
    tree:
      type: array
      items:
        type: object
        properties:
          path:
            type: string
          size:
            type: integer
          extension:
            type: string
          content:
            type: string
    errors:
      type: array
      items:
        type: string
