name: Validate Agent
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @open-gitagent/gitagent
      - run: npx gitagent validate
      - run: npx gitagent info